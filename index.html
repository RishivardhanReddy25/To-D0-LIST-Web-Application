<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Web Application</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> </head>

<body>

<div class="todo-box">
    <h2 class="todo-title">✨ To-Do List Application</h2>

    <div class="text-center mb-3">
        <button class="btn btn-secondary btn-sm" onclick="toggleInstructions()">📘 Show Instructions</button>
    </div>

    <div id="instructionBox">
        <h6><strong>Instructions</strong></h6>
        <table>
            <tr><th>Option</th><th>Description</th></tr>
            <tr><td><strong>All</strong></td><td>Shows every task you added.</td></tr>
            <tr><td><strong>Completed</strong></td><td>Shows only tasks marked as done.</td></tr>
            <tr><td><strong>Active</strong></td><td>Shows tasks that are still pending.</td></tr>
            <tr><td><strong>Checkbox ✓</strong></td><td>Mark a task as completed.</td></tr>
            <tr><td><strong>✏ Edit</strong></td><td>Edit the task name.</td></tr>
            <tr><td><strong>🗑 Delete</strong></td><td>Move task to Bin.</td></tr>
            <tr><td><strong>♻ Restore</strong></td><td>Bring task back from Bin.</td></tr>
        </table>
    </div>

    <div class="input-group mb-3">
        <input type="text" id="taskInput" class="form-control" placeholder="Write a task...">
        <button class="btn btn-primary" onclick="addTask()">Add</button>
    </div>

    <div id="message" class="mb-3"></div>

    <div class="filters text-center mb-3">
        <button class="btn btn-outline-dark btn-sm" onclick="showTasks('all')">All</button>
        <button class="btn btn-outline-success btn-sm" onclick="showTasks('completed')">Completed</button>
        <button class="btn btn-outline-warning btn-sm" onclick="showTasks('active')">Active</button>
        <button class="btn btn-outline-danger btn-sm" onclick="showTasks('bin')">🗑 Bin</button>
    </div>

    <ul class="list-group" id="taskList"></ul>
</div>

    <script src="script.js"></script>
</body>
</html>
